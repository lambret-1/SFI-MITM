name: SFI PR 快速检查

on:
  push:
    branches: [sing-box-for-apple]
  pull_request:
    branches: [sing-box-for-apple]
  workflow_dispatch:

concurrency:
  group: sfi-pr-quick-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  quick-check:
    name: 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查冲突标记
        if: always()
        run: |
          if grep -rnE '^(<<<<<<<|=======|>>>>>>>)' \
            --include='*.swift' --include='*.plist' \
            --include='*.pbxproj' --include='*.yml' \
            --include='*.yaml' --include='*.json' \
            --include='*.md' . 2>/dev/null; then
            echo "❌ 发现未解决的冲突标记" | tee -a quick_errors.log
            echo "❌ 检查冲突标记 | 发现未解决的冲突标记" >> quick_summary.log
            exit 1
          fi
          echo "✅ 检查冲突标记 | 无冲突标记" >> quick_summary.log

      - name: 检查 Info.plist 语法
        if: always()
        run: |
          FOUND=0
          ERRORS=""
          while IFS= read -r -d '' f; do
            FOUND=1
            if ! python3 -c "import plistlib,sys; plistlib.load(open(sys.argv[1],'rb'))" "$f" 2>/dev/null; then
              echo "❌ plist 语法错误: $f" | tee -a quick_errors.log
              ERRORS="${ERRORS}${f} "
            fi
          done < <(find . -name 'Info.plist' -not -path './.git/*' -print0)
          if [ "$FOUND" -eq 0 ]; then
            echo "⚠️ 检查 Info.plist 语法 | 未找到文件" >> quick_summary.log
          elif [ -n "$ERRORS" ]; then
            echo "❌ 检查 Info.plist 语法 | 语法错误: $ERRORS" >> quick_summary.log
            exit 1
          else
            echo "✅ 检查 Info.plist 语法 | 所有文件合法" >> quick_summary.log
          fi

      - name: 检查意外提交的文件
        if: always()
        run: |
          PATTERNS='\.DS_Store$|xcuserdata/|DerivedData/|\.swiftpm/|__pycache__/|\.pyc$'
          FOUND=$(git ls-files | grep -E "$PATTERNS" || true)
          if [ -n "$FOUND" ]; then
            echo "❌ 发现不应提交的文件：" | tee -a quick_errors.log
            echo "$FOUND" | tee -a quick_errors.log
            echo "❌ 检查意外提交的文件 | 发现不应提交的文件" >> quick_summary.log
            exit 1
          fi
          echo "✅ 检查意外提交的文件 | 无异常文件" >> quick_summary.log

      - name: 检查 pbxproj 有效性
        if: always()
        run: |
          FOUND=0
          ERRORS=""
          while IFS= read -r -d '' f; do
            FOUND=1
            open_count=$(tr -cd '{' < "$f" | wc -c)
            close_count=$(tr -cd '}' < "$f" | wc -c)
            if [ "$open_count" -ne "$close_count" ]; then
              echo "❌ pbxproj 大括号不匹配: $f" | tee -a quick_errors.log
              ERRORS="${ERRORS}${f} "
            fi
            if ! grep -q 'rootObject' "$f"; then
              echo "❌ pbxproj 缺少 rootObject: $f" | tee -a quick_errors.log
              ERRORS="${ERRORS}${f} "
            fi
          done < <(find . -name 'project.pbxproj' -not -path './.git/*' -print0)
          if [ "$FOUND" -eq 0 ]; then
            echo "⚠️ 检查 pbxproj 有效性 | 未找到文件" >> quick_summary.log
          elif [ -n "$ERRORS" ]; then
            echo "❌ 检查 pbxproj 有效性 | 存在无效文件" >> quick_summary.log
            exit 1
          else
            echo "✅ 检查 pbxproj 有效性 | 结构完整" >> quick_summary.log
          fi

      - name: 检查 entitlements
        if: always()
        run: |
          ENT_FILES=$(find . -name '*.entitlements' -not -path './.git/*' -not -path './Frameworks/*')
          if [ -z "$ENT_FILES" ]; then
            echo "⚠️ 检查 entitlements | 未找到文件" >> quick_summary.log
            exit 0
          fi
          echo "检查 entitlements 文件列表:"
          echo "$ENT_FILES"
          # 遍历所有 entitlements，只要有一个包含网络扩展权限即通过
          FOUND_NETEXT=0
          while IFS= read -r ENT; do
            if grep -q 'com.apple.developer.networking.networkextension' "$ENT"; then
              FOUND_NETEXT=1
              echo "  ✅ $ENT 包含网络扩展权限"
            fi
            if grep -qE 'get-task-allow.*true' "$ENT"; then
              echo "❌ entitlements 包含 get-task-allow=true: $ENT" | tee -a quick_errors.log
              echo "❌ 检查 entitlements | 包含调试权限 get-task-allow=true" >> quick_summary.log
              exit 1
            fi
          done <<< "$ENT_FILES"
          if [ "$FOUND_NETEXT" -eq 0 ]; then
            echo "❌ 缺少关键权限: com.apple.developer.networking.networkextension（所有 entitlements 均未包含）" | tee -a quick_errors.log
            echo "❌ 检查 entitlements | 缺少网络扩展权限" >> quick_summary.log
            exit 1
          fi
          echo "✅ 检查 entitlements | 权限配置正确" >> quick_summary.log

      - name: 检查大文件
        if: always()
        run: |
          BIG=$(find . -type f -size +5M -not -path './.git/*' -not -path './build/*' | head -20)
          if [ -n "$BIG" ]; then
            echo "❌ 发现大文件（>5MB）：" | tee -a quick_errors.log
            echo "$BIG" | tee -a quick_errors.log
            echo "❌ 检查大文件 | 发现超过 5MB 的文件" >> quick_summary.log
            exit 1
          fi
          echo "✅ 检查大文件 | 无超过 5MB 的文件" >> quick_summary.log

      - name: 检查硬编码密钥
        if: always()
        run: |
          if grep -rniE \
            'BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY|api[_-]?key\s*[:=]\s*["'"'"'][A-Za-z0-9_\-]{16,}|secret\s*[:=]\s*["'"'"'][A-Za-z0-9_\-]{16,}' \
            --include='*.swift' --include='*.plist' --include='*.json' \
            --include='*.yml' --include='*.yaml' --include='*.sh' . 2>/dev/null; then
            echo "❌ 疑似是硬编码密钥" | tee -a quick_errors.log
            echo "❌ 检查硬编码密钥 | 发现疑似密钥" >> quick_summary.log
            exit 1
          fi
          echo "✅ 检查硬编码密钥 | 无硬编码密钥" >> quick_summary.log

      - name: 检查空白错误
        if: always()
        env:
          BASE_REF: ${{ github.base_ref || 'sing-box-for-apple' }}
        run: |
          if ! git rev-parse --verify "origin/${BASE_REF}" >/dev/null 2>&1; then
            echo "⚠️ 检查空白错误 | 找不到对比分支，跳过" >> quick_summary.log
            exit 0
          fi
          if ! git diff --check "origin/${BASE_REF}...HEAD"; then
            echo "❌ 存在空白错误（行尾空格、tab 混用等）" | tee -a quick_errors.log
            echo "❌ 检查空白错误 | 存在行尾空格或 Tab 混用" >> quick_summary.log
            exit 1
          fi
          echo "✅ 检查空白错误 | 无空白错误" >> quick_summary.log

      - name: 检查文件末尾换行（警告）
        if: always()
        run: |
          FOUND=$(git ls-files '*.swift' '*.plist' '*.yml' '*.md' | while read -r f; do
            [ -s "$f" ] && [ "$(tail -c1 "$f" | wc -l)" -eq 0 ] && echo "$f"
          done || true)
          if [ -n "$FOUND" ]; then
            echo "⚠️ 检查末尾换行 | 部分文件缺少换行（不阻塞）" >> quick_summary.log
          else
            echo "✅ 检查末尾换行 | 所有文件末尾有换行" >> quick_summary.log
          fi

      - name: 检查重复文件名（警告）
        if: always()
        run: |
          DUP=$(git ls-files '*.swift' | xargs -n1 basename 2>/dev/null | sort | uniq -d || true)
          if [ -n "$DUP" ]; then
            echo "⚠️ 检查重复文件名 | 存在重复文件名（不阻塞）" >> quick_summary.log
          else
            echo "✅ 检查重复的文件名 | 无重复文件名" >> quick_summary.log
          fi

      - name: 上传快速检查汇总
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-check-results
          path: |
            quick_errors.log
            quick_summary.log
          if-no-files-found: ignore
          retention-days: 1

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备 SwiftLint 配置
        run: |
          if [ ! -f .swiftlint.yml ]; then
            echo "⚠️ 未找到 .swiftlint.yml，使用默认配置"
            printf 'disabled_rules:\n  - trailing_whitespace\n  - line_length\nopt_in_rules:\n  - force_unwrapping\n  - empty_count\n  - closure_spacing\n' > .swiftlint.yml
          fi

      - name: 运行 SwiftLint 并生成 JSON
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            if docker pull ghcr.io/realm/swiftlint:0.57.1; then break; fi
            echo "Docker 镜像拉取失败，5 秒后重试 ($i/3)..."
            sleep 5
          done

          docker run --rm \
            -v "$PWD:/work" -w /work \
            ghcr.io/realm/swiftlint:0.57.1 \
            swiftlint lint --strict --quiet \
            --reporter json > swiftlint.json || true

      - name: 上传 SwiftLint JSON 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftlint-json
          path: swiftlint.json
          if-no-files-found: ignore
          retention-days: 1

  doc-check:
    name: 接入文档门禁检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出 SFI 代码（sing-box-for-apple 分支）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: sfi

      - name: 检出 sing-box 核心代码（用于 API 一致性核对）
        uses: actions/checkout@v4
        with:
          repository: lambret-1/SFI-MITM
          ref: sing-box
          token: ${{ secrets.GITHUB_TOKEN }}
          path: sing-box-core

      - name: 运行接入文档门禁检查
        working-directory: sfi
        run: |
          echo "=========================================="
          echo "  运行接入文档门禁检查"
          echo "=========================================="
          chmod +x .github/scripts/check-docs.sh
          .github/scripts/check-docs.sh

      - name: 上传文档检查结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-check-results
          path: |
            sfi/doc_summary.log
          if-no-files-found: ignore
          retention-days: 1

  report:
    name: 生成报告与最终判定
    needs: [quick-check, swiftlint, doc-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载错误日志
        uses: actions/download-artifact@v4
        with:
          name: quick-check-results
          path: ./artifacts/quick-check

      - name: 下载 SwiftLint JSON
        uses: actions/download-artifact@v4
        with:
          name: swiftlint-json
          path: ./artifacts/swiftlint

      - name: 下载文档检查结果
        uses: actions/download-artifact@v4
        with:
          name: doc-check-results
          path: ./artifacts/doc-check

      - name: 生成可视化报告 (log/README.md)
        run: |
          cat << 'PYTHON_SCRIPT' > /tmp/generate_report.py
          import json, os, collections
          from datetime import datetime, timezone, timedelta

          quick_summary = []
          quick_summary_path = './artifacts/quick-check/quick_summary.log'
          if os.path.exists(quick_summary_path):
              with open(quick_summary_path, 'r', encoding='utf-8') as f:
                  quick_summary = [line.strip() for line in f if line.strip()]

          quick_errors = []
          quick_log_path = './artifacts/quick-check/quick_errors.log'
          if os.path.exists(quick_log_path):
              with open(quick_log_path, 'r', encoding='utf-8') as f:
                  quick_errors = [line.strip() for line in f if line.strip()]

          swiftlint_issues = []
          swift_json_path = './artifacts/swiftlint/swiftlint.json'
          if os.path.exists(swift_json_path):
              try:
                  with open(swift_json_path, 'r', encoding='utf-8') as f:
                      swiftlint_issues = json.load(f)
              except Exception as e:
                  print(f"⚠️ 解析 SwiftLint JSON 失败: {e}")

          # 解析文档检查结果
          doc_summary = []
          doc_summary_path = './artifacts/doc-check/doc_summary.log'
          if os.path.exists(doc_summary_path):
              with open(doc_summary_path, 'r', encoding='utf-8') as f:
                  doc_summary = [line.strip() for line in f if line.strip()]

          # 修复大小写导致的 KeyError: 'Error' 问题
          swift_errors = [i for i in swiftlint_issues if i.get('severity', '').lower() == 'error']
          swift_warnings = [i for i in swiftlint_issues if i.get('severity', '').lower() == 'warning']

          static_fails = sum(1 for line in quick_summary if line.startswith('❌'))
          doc_fails = sum(1 for line in doc_summary if line.startswith('❌'))
          total_errors = static_fails + len(swift_errors) + doc_fails
          doc_warnings = sum(1 for line in doc_summary if line.startswith('⚠️'))
          total_warnings = len(swift_warnings) + doc_warnings

          china_tz = timezone(timedelta(hours=8))
          china_time = datetime.now(china_tz).strftime('%Y-%m-%d %H:%M:%S')

          md = []
          md.append("# 🚀 PR 检查汇总报告\n")
          md.append("> 由 GitHub Actions 自动生成，包含静态检查、SwiftLint 与接入文档门禁结果。\n")
          md.append(f"**更新时间 (中国标准时间)**: `{china_time}`\n")

          md.append("## 📊 总体统计\n")
          md.append(f"- 🔴 **严重错误**: {total_errors}")
          md.append(f"  - 静态检查: {static_fails}")
          md.append(f"  - SwiftLint: {len(swift_errors)}")
          md.append(f"  - 文档门禁: {doc_fails}")
          md.append(f"- 🟡 **警告**: {total_warnings}")
          md.append(f"  - SwiftLint: {len(swift_warnings)}")
          md.append(f"  - 文档门禁: {doc_warnings}\n")

          md.append("## 🧱 静态检查详情\n")
          if not quick_summary:
              md.append("⚠️ 未获取到静态检查汇总信息\n")
          else:
              md.append("| 检查项 | 状态 | 详情 |")
              md.append("| :--- | :---: | :--- |")
              for line in quick_summary:
                  if line.startswith('❌'):
                      parts = line.split('|', 1)
                      name = parts[0].replace('❌', '').strip()
                      detail = parts[1].strip() if len(parts) > 1 else ''
                      md.append(f"| {name} | ❌ 失败 | {detail} |")
                  elif line.startswith('⚠️'):
                      parts = line.split('|', 1)
                      name = parts[0].replace('⚠️', '').strip()
                      detail = parts[1].strip() if len(parts) > 1 else ''
                      md.append(f"| {name} | ⚠️ 警告 | {detail} |")
                  else:
                      parts = line.split('|', 1)
                      name = parts[0].replace('✅', '').strip()
                      detail = parts[1].strip() if len(parts) > 1 else ''
                      md.append(f"| {name} | ✅ 通过 | {detail} |")
              md.append("")

          if quick_errors:
              md.append("### 📋 静态检查错误详情\n")
              md.append("```text")
              for e in quick_errors:
                  md.append(e)
              md.append("```\n")

          md.append("## 📄 接入文档门禁检查详情\n")
          if not doc_summary:
              md.append("⚠️ 未获取到文档检查汇总信息\n")
          else:
              md.append("| 检查项 | 状态 | 详情 |")
              md.append("| :--- | :---: | :--- |")
              for line in doc_summary:
                  if line.startswith('❌'):
                      parts = line.split('|', 1)
                      name = parts[0].replace('❌', '').strip()
                      detail = parts[1].strip() if len(parts) > 1 else ''
                      md.append(f"| {name} | ❌ 失败 | {detail} |")
                  elif line.startswith('⚠️'):
                      parts = line.split('|', 1)
                      name = parts[0].replace('⚠️', '').strip()
                      detail = parts[1].strip() if len(parts) > 1 else ''
                      md.append(f"| {name} | ⚠️ 警告 | {detail} |")
                  elif line.startswith('📊'):
                      parts = line.split('|', 1)
                      name = parts[0].replace('📊', '').strip()
                      detail = parts[1].strip() if len(parts) > 1 else ''
                      md.append(f"| {name} | 📊 汇总 | {detail} |")
                  else:
                      parts = line.split('|', 1)
                      name = parts[0].replace('✅', '').strip()
                      detail = parts[1].strip() if len(parts) > 1 else ''
                      md.append(f"| {name} | ✅ 通过 | {detail} |")
              md.append("")

          md.append("## 🔍 SwiftLint 检查汇总\n")
          md.append("| 检查项 | 状态 | 详情 |")
          md.append("| :--- | :---: | :--- |")
          if len(swift_errors) == 0 and len(swift_warnings) == 0:
              md.append("| SwiftLint 代码规范 | ✅ 通过 | 未发现任何问题 |\n")
          elif len(swift_errors) > 0:
              md.append(f"| SwiftLint 代码规范 | ❌ 失败 | 发现 {len(swift_errors)} 个错误, {len(swift_warnings)} 个警告 |\n")
          else:
              md.append(f"| SwiftLint 代码规范 | ⚠️ 警告 | 发现 {len(swift_warnings)} 个警告 |\n")

          md.append("## 📋 SwiftLint 详细列表\n")
          if not swiftlint_issues:
              md.append("✅ 未触发任何规则，全部通过！\n")
          else:
              rule_stats = collections.defaultdict(lambda: {'error': 0, 'warning': 0})
              for issue in swiftlint_issues:
                  rule = issue.get('rule_id', 'Unknown')
                  sev = issue.get('severity', 'warning').lower()
                  if sev in ('error', 'warning'):
                      rule_stats[rule][sev] += 1

              md.append("### 📊 触发的规则统计\n")
              md.append("| 规则 | 状态 | 触发次数 |")
              md.append("| :--- | :---: | :---: |")
              for rule, stats in sorted(rule_stats.items(), key=lambda x: (x[1]['error'], x[1]['warning']), reverse=True):
                  status = '❌ 错误' if stats['error'] > 0 else '⚠️ 警告'
                  total = stats['error'] + stats['warning']
                  md.append(f"| `{rule}` | {status} | {total} |")
              md.append("")

              md.append("### 📋 具体问题位置\n")
              md.append("| 文件 | 行号 | 级别 | 规则 | 描述 |")
              md.append("| :--- | :---: | :---: | :--- | :--- |")
              for issue in swiftlint_issues[:200]:
                  filepath = issue.get('file', 'Unknown')
                  rel_path = os.path.relpath(filepath, os.getcwd()) if os.path.isabs(filepath) else filepath
                  line = issue.get('line', 0)
                  rule = issue.get('rule_id', 'Unknown')
                  reason = issue.get('reason', '').replace('\n', ' ').replace('|', '\\|')
                  sev = issue.get('severity', 'warning').lower()
                  icon = '🔴' if sev == 'error' else '🟡'
                  md.append(f"| `{rel_path}` | L{line} | {icon} | `{rule}` | {reason} |")
              
              if len(swiftlint_issues) > 200:
                  md.append(f"\n> ⚠️ 问题过多，仅展示前 200 条。\n")

          content = "\n".join(md)
          os.makedirs('log', exist_ok=True)
          with open('log/README.md', 'w', encoding='utf-8') as f:
              f.write(content)

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write(content)

          print("✅ 报告已生成：log/README.md 及 GitHub Step Summary")

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"TOTAL_ERRORS={total_errors}\n")
          PYTHON_SCRIPT
          
          python3 /tmp/generate_report.py

      - name: 推送报告到仓库
        if: always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TARGET_BRANCH="${{ github.head_ref }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi
          
          echo "=== 触发事件: ${{ github.event_name }} ==="
          echo "=== 目标分支: $TARGET_BRANCH ==="
          
          if [ ! -f log/README.md ]; then
            echo "❌ 报告文件未生成，无法推送"
            exit 1
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          echo "=== 添加文件并强制提交 ==="
          git add log/README.md
          
          # 因为包含了时间戳，必然有改动。这里使用 --allow-empty 确保即使没变也不报错
          git commit -m "docs: 自动更新代码检查报告 [skip ci]" --allow-empty

          echo "=== 推送到远程分支 $TARGET_BRANCH ==="
          if ! git push origin HEAD:$TARGET_BRANCH; then
            echo "⚠️ 普通推送失败，尝试拉取最新代码后重试..."
            git fetch origin $TARGET_BRANCH
            cp log/README.md /tmp/README.md
            git reset --hard origin/$TARGET_BRANCH
            mkdir -p log
            cp /tmp/README.md log/README.md
            git add log/README.md
            git commit -m "docs: 自动更新代码检查报告 [skip ci]" --allow-empty
            git push origin HEAD:$TARGET_BRANCH || {
              echo "❌ 推送失败！请检查："
              echo "1. 仓库 Settings -> Actions -> General -> Workflow permissions 是否设为 Read and write"
              echo "2. 分支是否有保护规则（Settings -> Branches）"
              exit 1
            }
          fi
          echo "✅ 报告已成功推送到 $TARGET_BRANCH 分支"

      - name: 上传最终报告为 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: log/README.md
          retention-days: 14

      - name: 最终判定流水线状态
        run: |
          if [ "${{ env.TOTAL_ERRORS }}" != "0" ] && [ "${{ env.TOTAL_ERRORS }}" != "" ]; then
            echo "❌ 检查未通过，共发现 ${{ env.TOTAL_ERRORS }} 个严重错误。"
            exit 1
          fi
          echo "✅ 所有检查通过，流水线成功。"
          exit 0