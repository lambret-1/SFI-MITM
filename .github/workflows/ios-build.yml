name: SFI iOS 构建

on:
  push:
    branches:
      - sing-box-for-apple
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: sfi-ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.5"
  XCODE_SCHEME: "SFI"
  XCODE_PROJECT: "sing-box.xcodeproj"
  BUILD_CONFIGURATION: "Release"
  DERIVED_DATA_PATH: "build/DerivedData"
  ARCHIVE_PATH: "build/SFI.xcarchive"
  EXPORT_PATH: "build/export"

jobs:
  build-sfi-ios:
    name: 构建 SFI iOS 未签名 IPA
    runs-on: macos-14
    steps:
      - name: 检出 SFI 代码
        uses: actions/checkout@v4
        with:
          path: sfi

      - name: 检出 sing-box 核心代码（用于构建 Libbox）
        uses: actions/checkout@v4
        with:
          repository: lambret-1/SFI-MITM
          ref: sing-box
          token: ${{ secrets.GITHUB_TOKEN }}
          path: sing-box-core

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: sing-box-core/go.sum

      - name: 显示环境信息
        run: |
          go version
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|iphonesimulator"

      - name: 安装 gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          gomobile init
          echo "gomobile 安装完成"

      - name: 构建 Libbox.xcframework（仅 iOS 设备+模拟器切片）
        working-directory: sing-box-core
        run: |
          echo "=== 构建 Libbox.xcframework ==="
          go run ./cmd/internal/build_libbox -target apple -platform ios,iossimulator
          echo "=== 构建完成 ==="
          du -sh Libbox.xcframework

      - name: 复制 Libbox.xcframework 到 SFI Frameworks 目录
        run: |
          echo "=== 复制 Libbox.xcframework ==="
          rm -rf sfi/Frameworks/Libbox.xcframework
          cp -R sing-box-core/Libbox.xcframework sfi/Frameworks/
          echo "=== 复制完成 ==="
          ls -1 sfi/Frameworks/Libbox.xcframework/
          du -sh sfi/Frameworks/Libbox.xcframework

      - name: 构建 SFI iOS App（未签名）
        working-directory: sfi
        run: |
          echo "=== xcodebuild 构建（Release，未签名）==="
          xcodebuild \
            -project "${{ env.XCODE_PROJECT }}" \
            -scheme "${{ env.XCODE_SCHEME }}" \
            -configuration "${{ env.BUILD_CONFIGURATION }}" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${{ env.DERIVED_DATA_PATH }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tail -50
          echo "=== 构建退出码: $? ==="

      - name: 验证构建产物
        working-directory: sfi
        run: |
          echo "=== 查找 .app 产物 ==="
          find "${{ env.DERIVED_DATA_PATH }}" -name "*.app" -type d 2>/dev/null | head -5
          echo ""
          APP_PATH=$(find "${{ env.DERIVED_DATA_PATH }}/Build/Products" -name "SFI.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "✅ 找到 SFI.app: $APP_PATH"
            ls -lh "$APP_PATH"
            echo ""
            echo "=== 验证 Libbox 已嵌入 ==="
            find "$APP_PATH" -name "Libbox.framework" -type d 2>/dev/null | head -3
          else
            echo "❌ 未找到 SFI.app"
            find "${{ env.DERIVED_DATA_PATH }}/Build/Products" -maxdepth 3 -type d 2>/dev/null | head -20
            exit 1
          fi

      - name: 打包未签名 IPA
        working-directory: sfi
        run: |
          APP_PATH=$(find "${{ env.DERIVED_DATA_PATH }}/Build/Products" -name "SFI.app" -type d 2>/dev/null | head -1)
          echo "=== 打包 IPA ==="
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y SFI-unsigned.ipa Payload/
          rm -rf Payload
          ls -lh SFI-unsigned.ipa
          echo "IPA_SIZE=$(stat -f%z SFI-unsigned.ipa)" >> $GITHUB_ENV

      - name: 上传未签名 IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-unsigned.ipa
          path: sfi/SFI-unsigned.ipa
          retention-days: 30

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            sfi/${{ env.DERIVED_DATA_PATH }}/Logs/
          retention-days: 7
