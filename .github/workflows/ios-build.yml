name: SFI iOS 构建

on:
  push:
    branches:
      - sing-box-for-apple
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: sfi-ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.5"
  XCODE_SCHEME: "SFI"
  XCODE_PROJECT: "sing-box.xcodeproj"
  BUILD_CONFIGURATION: "Release"
  DERIVED_DATA_PATH: "build/DerivedData"
  ARCHIVE_PATH: "build/SFI.xcarchive"
  EXPORT_PATH: "build/export"

jobs:
  build-sfi-ios:
    name: 构建 SFI iOS 未签名 IPA
    runs-on: macos-14
    steps:
      - name: 检出 SFI 代码
        uses: actions/checkout@v4
        with:
          path: sfi

      - name: 检出 sing-box 核心代码（用于构建 Libbox）
        uses: actions/checkout@v4
        with:
          repository: lambret-1/SFI-MITM
          ref: sing-box
          token: ${{ secrets.GITHUB_TOKEN }}
          path: sing-box-core

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: sing-box-core/go.sum

      - name: 显示环境信息
        run: |
          go version
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|iphonesimulator"

      - name: 安装 gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          gomobile init
          echo "gomobile 安装完成"

      - name: 构建 Libbox.xcframework（仅 iOS 设备+模拟器切片）
        working-directory: sing-box-core
        run: |
          echo "=== 构建 Libbox.xcframework ==="
          go run ./cmd/internal/build_libbox -target apple -platform ios,iossimulator
          echo "=== 构建完成 ==="
          du -sh Libbox.xcframework

      - name: 复制 Libbox.xcframework 到 SFI Frameworks 目录
        run: |
          echo "=== 复制 Libbox.xcframework ==="
          rm -rf sfi/Frameworks/Libbox.xcframework
          cp -R sing-box-core/Libbox.xcframework sfi/Frameworks/
          echo "=== 复制完成 ==="
          ls -1 sfi/Frameworks/Libbox.xcframework/
          du -sh sfi/Frameworks/Libbox.xcframework

      - name: 构建 SFI iOS App（未签名，TrollStore 兼容）
        working-directory: sfi
        run: |
          echo "=== Xcode 版本 ==="
          xcodebuild -version
          echo ""
          echo "=== 诊断：xcodebuild -list（验证项目可读取）==="
          xcodebuild -project sing-box.xcodeproj -list 2>&1 | head -30 || echo "⚠️ xcodebuild -list 返回非零"
          echo ""
          echo "=== xcodebuild 构建（Release，未签名）==="
          # 注意：shell 有 -e，用 || true 防止 xcodebuild 失败时提前终止
          xcodebuild \
            -project sing-box.xcodeproj \
            -scheme "${{ env.XCODE_SCHEME }}" \
            -configuration "${{ env.BUILD_CONFIGURATION }}" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${{ env.DERIVED_DATA_PATH }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            build > build.log 2>&1 || true
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== 构建退出码: $BUILD_EXIT ==="
          echo "=== 构建日志（最后100行）==="
          tail -100 build.log
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "❌ xcodebuild 构建失败 (exit=$BUILD_EXIT)"
            exit 1
          fi
          echo "✅ xcodebuild 构建成功"

      - name: 验证构建产物（TrollStore 兼容）
        working-directory: sfi
        run: |
          echo "=== 查找 .app 产物 ==="
          find "${{ env.DERIVED_DATA_PATH }}/Build/Products" -name "*.app" -type d 2>/dev/null | head -10
          echo ""
          APP_PATH=$(find "${{ env.DERIVED_DATA_PATH }}/Build/Products" -name "SFI.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到 SFI.app"
            echo "=== Build/Products 目录结构 ==="
            find "${{ env.DERIVED_DATA_PATH }}/Build/Products" -maxdepth 3 -type d 2>/dev/null | head -20
            exit 1
          fi
          echo "✅ 找到 SFI.app: $APP_PATH"
          ls -lh "$APP_PATH"
          echo ""
          echo "=== 验证 Bundle ID ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" 2>/dev/null || defaults read "$APP_PATH/Info.plist" CFBundleIdentifier 2>/dev/null
          echo ""
          echo "=== 验证 Libbox 已嵌入 ==="
          find "$APP_PATH" -name "Libbox.framework" -type d 2>/dev/null | head -3
          echo ""
          echo "=== 验证 entitlements（TrollStore platform-application）==="
          if [ -f "$APP_PATH/embedded.mobileprovision" ]; then
            echo "embedded.mobileprovision 存在（未签名构建不应有，TrollStore 会忽略）"
          else
            echo "✅ 无 embedded.mobileprovision（TrollStore 兼容）"
          fi
          echo ""
          echo "=== 验证 Network Extension ==="
          find "$APP_PATH" -name "*.appex" -type d 2>/dev/null | head -3

      - name: 打包 TrollStore 兼容未签名 IPA
        working-directory: sfi
        run: |
          APP_PATH=$(find "${{ env.DERIVED_DATA_PATH }}/Build/Products" -name "SFI.app" -type d 2>/dev/null | head -1)
          echo "=== 打包 IPA（TrollStore 兼容，未签名）==="
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # 移除可能存在的 _CodeSignature（未签名构建）
          find Payload -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          zip -r -y SFI-TrollStore.ipa Payload/
          rm -rf Payload
          ls -lh SFI-TrollStore.ipa
          IPA_SIZE=$(stat -f%z SFI-TrollStore.ipa)
          echo "IPA_SIZE=$IPA_SIZE" >> $GITHUB_ENV
          echo "✅ TrollStore 兼容 IPA 打包完成 ($IPA_SIZE 字节)"

      - name: 上传 TrollStore 兼容 IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-TrollStore.ipa
          path: sfi/SFI-TrollStore.ipa
          retention-days: 30

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            sfi/build.log
            sfi/${{ env.DERIVED_DATA_PATH }}/Logs/
          retention-days: 7
