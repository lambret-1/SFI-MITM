name: SFI iOS 构建

on:
  push:
    branches:
      - sing-box-for-apple
    paths-ignore:
      - '**.md'
      - '**.yml'
  workflow_dispatch:

concurrency:
  group: sfi-ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.5"
  XCODE_SCHEME: "SFI"
  BUILD_CONFIGURATION: "Release"
  DERIVED_DATA_PATH: "build/DerivedData"

jobs:
  build-sfi-ios:
    name: 构建 SFI iOS 未签名 IPA（真机仅 arm64）
    runs-on: macos-15
    steps:
      # ========== 第一阶段：检出代码 ==========
      - name: 检出 SFI 代码
        uses: actions/checkout@v4
        with:
          path: sfi

      - name: 初始化 git submodule（Runestone）
        working-directory: sfi
        run: |
          git submodule update --init --recursive
          echo "=== Frameworks 目录 ==="
          ls -la Frameworks/
          echo "=== Runestone Package.swift ==="
          ls -la Frameworks/Runestone/Package.swift 2>/dev/null && echo "✅ Runestone 已初始化" || echo "❌ Runestone 未初始化"

      - name: 检出 sing-box 核心代码（用于构建 Libbox）
        uses: actions/checkout@v4
        with:
          repository: lambret-1/SFI-MITM
          ref: sing-box
          token: ${{ secrets.GITHUB_TOKEN }}
          path: sing-box-core

      # ========== 第二阶段：计算缓存 key ==========
      - name: 计算 sing-box 核心 commit hash（Libbox 缓存 key）
        id: core-sha
        run: |
          CORE_SHA=$(cd sing-box-core && git rev-parse HEAD)
          echo "core_sha=$CORE_SHA" >> $GITHUB_OUTPUT
          echo "sing-box 核心 commit: $CORE_SHA"
          echo "core_sha_short=${CORE_SHA:0:8}" >> $GITHUB_OUTPUT

      # ========== 第三阶段：Go 环境与 gomobile ==========
      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: sing-box-core/go.sum

      - name: 缓存 gomobile 二进制
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gomobile-${{ env.GO_VERSION }}

      - name: 安装 gomobile
        run: |
          if [ ! -f ~/go/bin/gomobile ]; then
            go install github.com/sagernet/gomobile/cmd/gomobile@latest
            gomobile init
          fi
          echo "gomobile 就绪: $(gomobile version 2>/dev/null || echo 'installed')"

      # ========== 第四阶段：Libbox 三级缓存 ==========
      # 缓存策略：
      #   key = libbox-ios-arm64-{sing-box核心commit hash}
      #   - 只改 SFI 壳：核心 commit 不变 → 缓存命中 → 跳过 Libbox 构建（省约10分钟）
      #   - 改了 sing-box 核心：核心 commit 变化 → 缓存未命中 → 重建 Libbox
      #   - 完全没变：全缓存命中（gomobile + Go模块 + Libbox）
      - name: 缓存 Libbox.xcframework（基于 sing-box 核心 commit）
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: sing-box-core/Libbox.xcframework
          key: libbox-ios-arm64-${{ steps.core-sha.outputs.core_sha }}
          restore-keys: |
            libbox-ios-arm64-

      - name: 构建 Libbox.framework（仅 iOS 真机 arm64，缓存未命中时执行）
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        working-directory: sing-box-core
        run: |
          echo "=== 缓存未命中，构建 Libbox（iOS 真机切片）==="
          echo "sing-box 核心 commit: ${{ steps.core-sha.outputs.core_sha_short }}"
          # gomobile 的 ios target 包含设备+模拟器，构建后删除模拟器切片
          go run ./cmd/internal/build_libbox -target apple -platform ios
          echo "=== 原始 xcframework 切片 ==="
          ls -1 Libbox.xcframework/
          echo ""
          echo "=== 删除模拟器切片（仅保留真机 ios-arm64）==="
          rm -rf Libbox.xcframework/ios-arm64_x86_64-simulator
          echo "=== 最终 xcframework 切片 ==="
          ls -1 Libbox.xcframework/
          du -sh Libbox.xcframework
          echo "✅ Libbox 构建完成，将自动保存到缓存"

      - name: Libbox 缓存命中提示
        if: steps.cache-libbox.outputs.cache-hit == 'true'
        run: |
          echo "✅ Libbox 缓存命中（sing-box 核心未变更），跳过构建"
          echo "   核心 commit: ${{ steps.core-sha.outputs.core_sha_short }}"
          ls -1 sing-box-core/Libbox.xcframework/
          du -sh sing-box-core/Libbox.xcframework

      # ========== 第五阶段：复制 Libbox 到项目 ==========
      - name: 复制 Libbox.xcframework 到项目根目录
        run: |
          rm -rf sfi/Libbox.xcframework
          cp -R sing-box-core/Libbox.xcframework sfi/Libbox.xcframework
          echo "✅ Libbox 复制完成（项目根目录）"
          ls -1 sfi/Libbox.xcframework/

      # ========== 第六阶段：构建 SFI iOS App ==========
      - name: 构建 SFI iOS App（Release，arm64 真机，未签名）
        working-directory: sfi
        run: |
          echo "=== Xcode 版本 ==="
          xcodebuild -version
          echo ""
          echo "=== xcodebuild 构建（arm64 真机优化）==="
          set +e
          xcodebuild \
            -project sing-box.xcodeproj \
            -scheme "${{ env.XCODE_SCHEME }}" \
            -configuration "${{ env.BUILD_CONFIGURATION }}" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${{ env.DERIVED_DATA_PATH }}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build > build.log 2>&1
          BUILD_EXIT=$?
          set -e
          echo "=== 构建退出码: $BUILD_EXIT ==="
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "❌ xcodebuild 构建失败 (exit=$BUILD_EXIT)"
            echo ""
            echo "=== 编译错误（grep error:）==="
            grep -n "error:" build.log | head -40
            echo ""
            echo "=== 编译警告（前 20 条）==="
            grep -n "warning:" build.log | head -20
            echo ""
            echo "=== build.log 最后 50 行 ==="
            tail -50 build.log
            exit 1
          fi
          echo "✅ xcodebuild 构建成功"
          tail -5 build.log

      # ========== 第七阶段：验证与打包 ==========
      - name: 验证构建产物
        working-directory: sfi
        run: |
          APP_PATH=$(find "${{ env.DERIVED_DATA_PATH }}/Build/Products" -name "SFI.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到 SFI.app"
            find "${{ env.DERIVED_DATA_PATH }}/Build/Products" -maxdepth 3 -type d 2>/dev/null | head -20
            exit 1
          fi
          echo "✅ SFI.app: $APP_PATH"
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" 2>/dev/null || defaults read "$APP_PATH/Info.plist" CFBundleIdentifier 2>/dev/null)"
          echo "Network Extension: $(find "$APP_PATH" -name '*.appex' -type d 2>/dev/null | head -1)"
          test ! -f "$APP_PATH/embedded.mobileprovision" && echo "✅ 无 embedded.mobileprovision（TrollStore 兼容）"

      - name: 打包未签名 IPA（TrollStore 兼容）
        working-directory: sfi
        run: |
          APP_PATH=$(find "${{ env.DERIVED_DATA_PATH }}/Build/Products" -name "SFI.app" -type d 2>/dev/null | head -1)
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          find Payload -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          zip -r -y SFI-TrollStore.ipa Payload/
          rm -rf Payload
          IPA_SIZE=$(stat -f%z SFI-TrollStore.ipa)
          echo "IPA_SIZE=$IPA_SIZE" >> $GITHUB_ENV
          echo "✅ IPA 打包完成: $(ls -lh SFI-TrollStore.ipa | awk '{print $5}')"

      - name: 上传 IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-TrollStore.ipa
          path: sfi/SFI-TrollStore.ipa
          retention-days: 30

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            sfi/build.log
            sfi/${{ env.DERIVED_DATA_PATH }}/Logs/
          retention-days: 7
