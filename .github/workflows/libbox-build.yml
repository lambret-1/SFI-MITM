name: Libbox 构建（iOS 设备专用）

on:
  push:
    branches:
      - sing-box
    paths:
      - 'experimental/libbox/**'
      - 'protocol/mitm/**'
      - 'option/mitm.go'
      - 'daemon/**'
      - 'cmd/internal/build_libbox/**'
      - '.github/workflows/libbox-build.yml'
  workflow_dispatch:

concurrency:
  group: libbox-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.5"

jobs:
  build-libbox-ios:
    name: 构建 Libbox.framework（ios-arm64）
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 显示环境信息
        run: |
          go version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 安装 gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          gomobile init

      - name: Go 构建缓存（libbox 依赖预编译）
        run: |
          echo "=== 预编译依赖，加速 gomobile bind ==="
          go build ./experimental/libbox/... 2>&1 || true
          echo "依赖预编译完成"

      - name: 构建 Libbox.framework（仅 ios-arm64 设备切片）
        run: |
          echo "=== 仅构建 iOS 设备切片（ios-arm64），不构建模拟器/tvOS/macOS ==="
          go run ./cmd/internal/build_libbox -target apple -platform ios
          echo "=== 构建完成，检查输出 ==="
          ls -lh
          if [ -d "Libbox.framework" ]; then
            echo "✅ 输出为 Libbox.framework（单平台）"
            ls -lh Libbox.framework/
          elif [ -d "Libbox.xcframework" ]; then
            echo "⚠️ 输出为 Libbox.xcframework，检查内含切片"
            ls -1 Libbox.xcframework/
          else
            echo "❌ 未找到构建产物"
            exit 1
          fi

      - name: 验证 framework 架构
        run: |
          if [ -d "Libbox.framework" ]; then
            FRAMEWORK_BIN="Libbox.framework/Libbox"
          else
            FRAMEWORK_BIN=$(find Libbox.xcframework -name "Libbox" -type f | grep -i "ios-arm64" | head -1)
          fi
          echo "=== 验证二进制架构 ==="
          lipo -info "$FRAMEWORK_BIN" 2>/dev/null || file "$FRAMEWORK_BIN"
          echo ""
          echo "=== 产物大小 ==="
          if [ -d "Libbox.framework" ]; then
            du -sh Libbox.framework
          else
            du -sh Libbox.xcframework
          fi

      - name: 打包产物
        run: |
          if [ -d "Libbox.framework" ]; then
            zip -r -y Libbox-ios-arm64.framework.zip Libbox.framework/
            echo "PRODUCT_NAME=Libbox-ios-arm64.framework.zip" >> $GITHUB_ENV
          else
            zip -r -y Libbox-ios-arm64.xcframework.zip Libbox.xcframework/
            echo "PRODUCT_NAME=Libbox-ios-arm64.xcframework.zip" >> $GITHUB_ENV
          fi
          ls -lh *.zip

      - name: 上传 Libbox 产物
        uses: actions/upload-artifact@v4
        with:
          name: Libbox-ios-arm64
          path: |
            *.zip
            Libbox.framework/
            Libbox.xcframework/
          retention-days: 30
